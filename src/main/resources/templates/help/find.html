<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Help — Manush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/static/css/main.css}">
    <link rel="stylesheet" th:href="@{/static/css/components.css}">
    <link rel="stylesheet" th:href="@{/static/css/help.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar" role="navigation">
    <div class="container navbar-inner">
        <a href="/" class="brand"><span class="script">Manush</span></a>
        <div class="nav-links">
            <a href="/feed" class="nav-link">Feed</a>
            <a href="/help" class="nav-link" style="color:var(--manush-primary);font-weight:600">Find Help</a>
            <a href="/help/ask" class="nav-link">Ask Help</a>
            <a href="/jobs" class="nav-link">Jobs</a>
            <a href="/blood" class="nav-link">Blood Bank</a>
            <a href="/jogajog" class="nav-link">Jogajog</a>
            <a href="/ai" class="nav-link">Manush AI</a>
        </div>
        <div class="nav-actions">
            <button class="btn-icon" id="themeToggle">☀️</button>
            <div id="authArea">
                <a href="/auth/login" class="btn btn-ghost">Login</a>
                <a href="/auth/register" class="btn btn-3d">Join</a>
            </div>
        </div>
    </div>
</nav>

<div class="container find-layout">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar card-3d" style="padding: var(--space-lg)">
        <h3 style="font-size: 1.1rem; margin-bottom: var(--space-md)">Filters</h3>

        <div class="filter-group">
            <label class="filter-label">Category</label>
            <div id="categoryFilters">
                <button class="filter-chip active" data-cat="">All</button>
                <button class="filter-chip" data-cat="GENERAL_HELP">General</button>
                <button class="filter-chip" data-cat="EMERGENCY_HELP">Emergency</button>
                <button class="filter-chip" data-cat="BLOOD_DONATION">Blood</button>
                <button class="filter-chip" data-cat="JOB_OPPORTUNITY">Jobs</button>
                <button class="filter-chip" data-cat="SCAM">Scams</button>
                <button class="filter-chip" data-cat="LOST_AND_FOUND">Lost & Found</button>
            </div>
        </div>

        <div class="filter-group">
            <label class="filter-label">Urgency</label>
            <div id="urgencyFilters">
                <button class="filter-chip active" data-urgency="">All</button>
                <button class="filter-chip" data-urgency="EMERGENCY">Emergency</button>
                <button class="filter-chip" data-urgency="HIGH">High</button>
                <button class="filter-chip" data-urgency="NORMAL">Normal</button>
                <button class="filter-chip" data-urgency="LOW">Low</button>
            </div>
        </div>

        <div class="filter-group">
            <label class="filter-label">Distance: <span id="distanceValue">10</span> km</label>
            <input type="range" id="distanceSlider" class="distance-slider" min="1" max="50" value="10">
        </div>

        <div class="filter-group">
            <label class="filter-label">Location</label>
            <input type="text" id="locationInput" class="form-input" placeholder="Enter area or use GPS">
            <button type="button" id="useMyLocation" class="btn btn-ghost btn-sm" style="margin-top: var(--space-sm); width: 100%">
                📍 Use my current location
            </button>
        </div>

        <button type="button" id="clearFilters" class="btn btn-ghost btn-sm btn-full" style="margin-top: var(--space-md)">
            Clear all filters
        </button>
    </aside>

    <!-- Results -->
    <main>
        <div class="results-header">
            <h2 class="serif" style="font-size: 1.8rem">Nearby Help Requests</h2>
            <div style="display: flex; gap: var(--space-sm); align-items: center">
                <span class="results-count" id="resultsCount">Loading...</span>
                <select id="sortSelect" class="sort-select">
                    <option value="newest">Newest first</option>
                    <option value="nearest">Nearest first</option>
                    <option value="urgency">Highest urgency</option>
                </select>
            </div>
        </div>

        <div id="resultsList">
            <div class="skeleton skeleton-card" style="margin-bottom: 16px"></div>
            <div class="skeleton skeleton-card" style="margin-bottom: 16px"></div>
            <div class="skeleton skeleton-card" style="margin-bottom: 16px"></div>
        </div>
    </main>
</div>

<script type="module">
import { apiFetch } from '/static/js/core/api.js';
import { renderPostCard } from '/static/js/components/post-card.js';
import { showSuccess, showError } from '/static/js/core/toast.js';
import { initTheme } from '/static/js/core/theme.js';
import { setupNavbar, isLoggedIn } from '/static/js/core/auth.js';

initTheme();
await setupNavbar();

// Filter state
let filters = {
    category: '',
    urgency: '',
    distance: 10,
    location: null,
    sort: 'newest'
};

// Category filter chips
document.querySelectorAll('#categoryFilters .filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('#categoryFilters .filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filters.category = chip.dataset.cat;
        loadResults();
    });
});

// Urgency filter chips
document.querySelectorAll('#urgencyFilters .filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('#urgencyFilters .filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filters.urgency = chip.dataset.urgency;
        loadResults();
    });
});

// Distance slider
document.getElementById('distanceSlider').addEventListener('input', (e) => {
    filters.distance = parseInt(e.target.value);
    document.getElementById('distanceValue').textContent = filters.distance;
    loadResults();
});

// Sort select
document.getElementById('sortSelect').addEventListener('change', (e) => {
    filters.sort = e.target.value;
    loadResults();
});

// Location detection
document.getElementById('useMyLocation').addEventListener('click', () => {
    if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser');
        return;
    }

    const btn = document.getElementById('useMyLocation');
    btn.disabled = true;
    btn.textContent = 'Locating...';

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const { latitude, longitude } = position.coords;
            filters.location = { lat: latitude, lng: longitude };
            document.getElementById('locationInput').value = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            showSuccess('Location detected!');
            btn.disabled = false;
            btn.textContent = '📍 Use my current location';
            loadResults();
        },
        (error) => {
            showError('Location access denied. Enter area manually.');
            btn.disabled = false;
            btn.textContent = '📍 Use my current location';
        }
    );
});

// Clear filters
document.getElementById('clearFilters').addEventListener('click', () => {
    filters = { category: '', urgency: '', distance: 10, location: null, sort: 'newest' };
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    document.querySelector('#categoryFilters .filter-chip[data-cat=""]').classList.add('active');
    document.querySelector('#urgencyFilters .filter-chip[data-urgency=""]').classList.add('active');
    document.getElementById('distanceSlider').value = 10;
    document.getElementById('distanceValue').textContent = '10';
    document.getElementById('locationInput').value = '';
    document.getElementById('sortSelect').value = 'newest';
    loadResults();
});

async function loadResults() {
    const resultsList = document.getElementById('resultsList');
    resultsList.innerHTML = `
        <div class="skeleton skeleton-card" style="margin-bottom: 16px"></div>
        <div class="skeleton skeleton-card" style="margin-bottom: 16px"></div>
        <div class="skeleton skeleton-card" style="margin-bottom: 16px"></div>
    `;

    try {
        const params = new URLSearchParams();
        if (filters.category) params.append('category', filters.category);
        if (filters.urgency) params.append('urgency', filters.urgency);
        params.append('radius', filters.distance);
        params.append('sort', filters.sort);
        if (filters.location) {
            params.append('lat', filters.location.lat);
            params.append('lng', filters.location.lng);
        }

        const data = await apiFetch(`/help/nearby?${params.toString()}`);
        const posts = Array.isArray(data) ? data : (data.content || []);

        document.getElementById('resultsCount').textContent = `${posts.length} result${posts.length !== 1 ? 's' : ''}`;

        if (posts.length === 0) {
            resultsList.innerHTML = `
                <div class="empty-state card-3d">
                    <div class="empty-icon">🔍</div>
                    <h3>No help requests found</h3>
                    <p>Try adjusting your filters or expanding the search radius.</p>
                    <a href="/help/ask" class="btn btn-3d btn-sm">Ask for Help Instead</a>
                </div>
            `;
            return;
        }

        resultsList.innerHTML = posts.map(renderPostCard).join('');
        attachResultListeners();
    } catch (e) {
        resultsList.innerHTML = `<div class="card-3d" style="padding:24px;text-align:center;color:var(--manush-danger)">Failed to load results.</div>`;
    }
}

function attachResultListeners() {
    document.querySelectorAll('.btn-react').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!isLoggedIn()) return window.location.href = '/auth/login';
            const postId = btn.dataset.id;
            try {
                const res = await apiFetch(`/posts/${postId}/react`, { method: 'POST' });
                btn.querySelector('span').textContent = res.reactionCount;
            } catch (e) {}
        });
    });

    document.querySelectorAll('.btn-report').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!isLoggedIn()) return window.location.href = '/auth/login';
            const postId = btn.dataset.id;
            const { value: reason } = await Swal.fire({
                title: 'Report this post',
                input: 'textarea',
                inputPlaceholder: 'Tell us what is wrong...',
                showCancelButton: true
            });
            if (reason) {
                try {
                    await apiFetch(`/posts/${postId}/report`, {
                        method: 'POST',
                        body: JSON.stringify({ reason })
                    });
                    showSuccess('Report submitted.');
                } catch (e) {}
            }
        });
    });
}

loadResults();
</script>
</body>
</html>
