<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Manush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/static/css/main.css}">
    <link rel="stylesheet" th:href="@{/static/css/auth.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
<div class="auth-container">
    <div class="auth-card card-3d">
        <div class="auth-header">
            <a href="/" class="brand"><span class="script">Manush</span></a>
            <h1 class="auth-title">Forgot Password?</h1>
            <p class="auth-subtitle">Enter your email or phone to reset your password</p>
        </div>

        <form id="forgotPasswordForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="identifier" class="form-label">Email or Phone</label>
                <input type="text" id="identifier" name="identifier" class="form-input"
                       placeholder="your@email.com or 01xxxxxxxxx" required>
                <span class="field-error" id="identifierError"></span>
            </div>
            <button type="submit" class="btn btn-3d btn-full" id="submitBtn">Send Reset Link</button>
        </form>

        <p class="auth-footer">Remember your password? <a href="/auth/login">Sign In</a></p>
    </div>
</div>

<script type="module">
import { apiFetch } from '/static/js/core/api.js';
import { initTheme } from '/static/js/core/theme.js';

initTheme();

document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    
    try {
        await apiFetch('/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({
                identifier: document.getElementById('identifier').value
            })
        });
        
        Swal.fire({
            icon: 'success',
            title: 'Reset Link Sent',
            text: 'If your account exists, you will receive a password reset link shortly.',
            confirmButtonColor: 'var(--manush-primary)'
        }).then(() => {
            window.location.href = '/auth/login';
        });
    } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
    }
});
</script>
</body>
</html>
