<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Manush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/static/css/main.css}">
    <link rel="stylesheet" th:href="@{/static/css/auth.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
<div class="auth-container">
    <div class="auth-card card-3d">
        <div class="auth-header">
            <a href="/" class="brand"><span class="script">Manush</span></a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your account</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="identifier" class="form-label">Email or Phone</label>
                <input type="text" id="identifier" name="identifier" class="form-input"
                       placeholder="your@email.com or 01xxxxxxxxx" required autocomplete="username">
                <span class="field-error" id="identifierError"></span>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-with-action">
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="input-action" onclick="togglePassword()">👁️</button>
                </div>
                <span class="field-error" id="passwordError"></span>
            </div>
            <a href="/auth/forgot-password" class="forgot-link">Forgot password?</a>
            <button type="submit" class="btn btn-3d btn-full" id="loginBtn">Sign In</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <a href="/oauth2/authorization/google" class="btn-google">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="" width="20" height="20">
            Continue with Google
        </a>

        <p class="auth-footer">Don't have an account? <a href="/auth/register">Join Manush</a></p>
    </div>
</div>

<script type="module">
import { apiFetch } from '/static/js/core/api.js';
import { initTheme } from '/static/js/core/theme.js';

initTheme();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
        const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                identifier: document.getElementById('identifier').value,
                password: document.getElementById('password').value
            })
        });

        localStorage.setItem('access_token', data.accessToken);
        localStorage.setItem('refresh_token', data.refreshToken);
        if (data.userId) localStorage.setItem('user_id', data.userId);
        if (data.name) localStorage.setItem('user_name', data.name);
        if (data.roles) localStorage.setItem('user_roles', JSON.stringify(data.roles));

        const isAdminUser = Array.isArray(data.roles) && data.roles.some(r => r === 'ADMIN' || r === 'ROLE_ADMIN');
        if (isAdminUser) {
            localStorage.setItem('is_admin', 'true');
        } else {
            localStorage.removeItem('is_admin');
        }

        if (!data.profileComplete && !isAdminUser) {
            window.location.href = '/auth/complete-profile';
        } else if (isAdminUser) {
            window.location.href = '/admin/moderation';
        } else {
            window.location.href = '/feed';
        }
    } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
});

function togglePassword() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
}
window.togglePassword = togglePassword;
</script>
</body>
</html>
