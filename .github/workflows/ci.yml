name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build & verify
        run: ./mvnw clean verify -DskipTests
        env:
          MONGODB_URI: mongodb://localhost:27017/manush_test
          JWT_SECRET: ci-test-secret-key-at-least-64-characters-long-for-testing-only
